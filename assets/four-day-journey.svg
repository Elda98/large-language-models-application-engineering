<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" role="img" aria-labelledby="title desc">
  <title id="title">Four-day Murshid Mini development path</title>
  <desc id="desc">Four connected stages: foundations, tools, guard and test, measure and finish.</desc>
  <defs>
