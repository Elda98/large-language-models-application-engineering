<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-labelledby="title desc">
  <title id="title">Observed core project results</title>
  <desc id="desc">The fixed regression suite passed ten out of ten cases. The cache experiment reduced mock calls from three to one across three identical requests, with two cache hits and a 66.7 percent hit rate. External model API calls in the core were zero.</desc>
  <rect width="1500" height="360" rx="24" fill="#0D1425"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(46 40)">
      <text x="0" y="22" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="2">REGRESSION</text>
      <text x="0" y="78" fill="#F8FAFC" font-size="52" font-weight="750">10 / 10</text>
      <text x="0" y="108" fill="#CBD5E1" font-size="17">Golden cases passed</text>
      <rect x="0" y="135" width="330" height="14" rx="7" fill="#273449"/>
      <rect x="0" y="135" width="330" height="14" rx="7" fill="#8B5CF6"/>
      <text x="0" y="184" fill="#C4B5FD" font-size="14" font-weight="700">100% OF THE FIXED TEST SET</text>
    </g>
    <path d="M425 44V314" stroke="#64748B" stroke-opacity=".3"/>
    <g transform="translate(480 40)">
      <text x="0" y="22" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="2">MOCK CALL COMPARISON</text>
      <text x="0" y="75" fill="#CBD5E1" font-size="17">Without cache</text>
      <rect x="0" y="91" width="360" height="18" rx="9" fill="#273449"/>
      <rect x="0" y="91" width="360" height="18" rx="9" fill="#8B5CF6"/>
      <text x="377" y="106" fill="#F8FAFC" font-size="19" font-weight="700">3</text>
      <text x="0" y="151" fill="#CBD5E1" font-size="17">With cache</text>
      <rect x="0" y="167" width="360" height="18" rx="9" fill="#273449"/>
      <rect x="0" y="167" width="120" height="18" rx="9" fill="#60A5FA"/>
      <text x="377" y="182" fill="#F8FAFC" font-size="19" font-weight="700">1</text>
      <text x="0" y="235" fill="#7DD3FC" font-size="14" font-weight="700">2 OF 3 REQUESTS WERE CACHE HITS</text>
      <text x="0" y="271" fill="#F8FAFC" font-size="38" font-weight="750">66.7%</text>
      <text x="153" y="270" fill="#94A3B8" font-size="16">hit rate</text>
    </g>
    <path d="M1010 44V314" stroke="#64748B" stroke-opacity=".3"/>
    <g transform="translate(1062 40)">
      <text x="0" y="22" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="2">CORE RUNTIME</text>
      <text x="0" y="92" fill="#38BDF8" font-size="66" font-weight="750">0</text>
      <text x="54" y="89" fill="#F8FAFC" font-size="22" font-weight="700">External model API calls</text>
      <text x="0" y="135" fill="#CBD5E1" font-size="17">Deterministic mock workflow</text>
      <rect x="0" y="177" width="345" height="1" fill="#64748B" opacity=".5"/>
      <text x="0" y="218" fill="#94A3B8" font-size="14">Interpretation</text>
      <text x="0" y="248" fill="#CBD5E1" font-size="16">Call counts are deterministic;</text>
      <text x="0" y="273" fill="#CBD5E1" font-size="16">not a measured live API speed-up.</text>
    </g>
  </g>
</svg>