      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="340" rx="26" fill="#0D1425"/>
  <path d="M180 156H1420" fill="none" stroke="url(#track)" stroke-width="3" stroke-dasharray="6 10" opacity=".8"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
