      <text x="26" y="158" fill="#CBD5E1" font-size="17">Mock client · Response contract</text>
      <text x="26" y="186" fill="#A78BFA" font-size="14" font-weight="700">CELLS 1–3</text>
    </g>
    <g transform="translate(440 66)">
