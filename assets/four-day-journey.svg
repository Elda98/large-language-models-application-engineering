      <text x="26" y="52" fill="#A5B4FC" font-size="14" font-weight="700" letter-spacing="2">DAY 02</text>
      <text x="26" y="96" fill="#F8FAFC" font-size="29" font-weight="700">Structure &amp; tools</text>
      <text x="26" y="132" fill="#CBD5E1" font-size="17">Ticket validation</text>
      <text x="26" y="158" fill="#CBD5E1" font-size="17">Read-only lookup · Ownership</text>
