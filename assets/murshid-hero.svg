<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Murshid Mini</title>
  <desc id="desc">A controlled service-assistant prototype built in four stages, from foundations and tools to guardrails, testing, measurement and caching.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.58" stop-color="#15152D"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <ellipse cx="1290" cy="270" rx="330" ry="260" fill="#8B5CF6" opacity=".16" filter="url(#blur)"/>
  <ellipse cx="1480" cy="450" rx="250" ry="170" fill="#38BDF8" opacity=".10" filter="url(#blur)"/>
  <path d="M0 410 C320 330 470 560 820 430 S1300 330 1600 390" fill="none" stroke="#A78BFA" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 448 C300 370 520 590 870 460 S1320 360 1600 420" fill="none" stroke="#60A5FA" stroke-opacity=".10" stroke-width="2"/>
